<div class="registration-container">
  <h1 class="registration-title">Registration</h1>
  <form [formGroup]="registrationForm" (ngSubmit)="register()">
    <div class="registration-form">
      <mat-form-field>
        <mat-label>Name</mat-label>
        <input matInput formControlName="name" type="text" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Surname</mat-label>
        <input matInput formControlName="surname" type="text" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Username</mat-label>
        <input matInput formControlName="username" type="text" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Email</mat-label>
        <input matInput formControlName="email" type="text" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" />
      </mat-form-field>
      <mat-form-field>
        <mat-label>Role</mat-label>
        <mat-select formControlName="role">
          <mat-option value="tourist">Tourist</mat-option>
          <mat-option value="author">Author</mat-option>
        </mat-select>
      </mat-form-field>
      <button color="primary" type="submit" mat-raised-button>Register</button>
      <p>Already have an account?<a href="/login">Login</a></p>
    </div>
  </form>
</div>
